<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topshelf Websites | Premium 9-Page Builds in 73 Hours</title>
    <style>
        :root {
            --bg: #060608;
            --surface: #0e0e12;
            --border: #1c1c24;
            --text: #f1f1f4;
            --muted: #787880;
            --accent: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 4rem 2rem; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 5rem; }
        h1 { font-size: 3rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 1.5rem; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); font-size: 1.25rem; max-width: 600px; margin: 0 auto; }
        
        h2 { font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        section { margin-bottom: 5rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 12px; }
        .card h3 { font-size: 1.2rem; margin-bottom: 0.75rem; color: #fff; }
        .card p { color: var(--muted); font-size: 0.95rem; }
        
        .price-row { display: flex; flex-wrap: wrap; gap: 2rem; margin-top: 1.5rem; }
        .price-card { flex: 1; min-width: 250px; background: var(--surface); border: 1px solid var(--border); padding: 2.5rem; border-radius: 12px; border-top: 4px solid var(--accent); }
        .price-num { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
        
        form { background: var(--surface); border: 1px solid var(--border); padding: 3rem; border-radius: 12px; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: var(--muted); font-weight: 600; }
        input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; color: #fff; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button { background: var(--accent); color: #fff; border: none; padding: 1.25rem; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
